apiVersion: v1
kind: Service
metadata:
  name: findash
  namespace: dashboard
  labels:
    app.kubernetes.io/name: findash
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: findash
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 5000
      targetPort: http
