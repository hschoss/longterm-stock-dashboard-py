apiVersion: apps/v1
kind: Deployment
metadata:
  name: findash
  namespace: dashboard
  labels:
    app.kubernetes.io/name: findash
    app.kubernetes.io/component: web
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: findash
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: findash
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: findash
          # Erwartetes Image. Bauen und pushen mit:
          #   docker build -f docker/Dockerfile -t <registry>/findash:<tag> .
          #   docker push <registry>/findash:<tag>
          image: findash:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_ENV
              value: "kubernetes"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DATASERVER_URL
              valueFrom:
                secretKeyRef:
                  name: dataserver-credentials
                  key: DATASERVER_URL
            # DATABASE_URL zeigt bewusst nicht auf den externen dataserver.
            # Solange die lokale Metadaten-DB in-Cluster nicht existiert,
            # setzt der Deployer sie z. B. auf sqlite oder eine eigene Postgres.
            # Fuer den Read-Only-ETF-Modus wird DATABASE_URL nicht benoetigt,
            # weil die neuen ETF-Seiten ausschliesslich DATASERVER_URL nutzen.
            - name: DATABASE_URL
              value: "postgresql+psycopg://noop:noop@127.0.0.1:5432/noop"
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 10001
