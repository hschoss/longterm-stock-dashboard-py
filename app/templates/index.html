{% extends "base.html" %}

{% block title %}Stock Tracker{% endblock %}

{% block content %}
  <section class="hero">
    <h1>Long-term stock analysis</h1>
    <p>Analyze one stock at a time using historical prices, long-term resampling, and log2 regression.</p>
    <div class="actions">
      <a class="button" href="{{ url_for('main.stocks') }}">View stocks</a>
      <a class="button secondary" href="{{ url_for('main.stock_detail', symbol=default_ticker) }}">Open {{ default_ticker }}</a>
    </div>
  </section>
{% endblock %}
